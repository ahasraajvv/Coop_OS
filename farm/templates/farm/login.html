{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoopOS — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-full max-w-sm mx-4 rounded-2xl shadow-lg p-8 border border-emerald-100">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-emerald-700 flex justify-center items-center gap-2"><span>🐔</span> CoopOS</h1>
            <p class="text-slate-500 text-sm mt-1 font-semibold">பண்ணை மேலாண்மை</p>
        </div>

        <!-- Error Message (hidden by default) -->
        <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm font-semibold rounded-lg px-4 py-3 mb-4 text-center">
            தவறான பயனர் பெயர் அல்லது கடவுச்சொல் (Invalid credentials).
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            
            <div>
                <label class="text-sm font-bold text-slate-600 block mb-1">Username (பயனர் பெயர்)</label>
                <input 
                    type="text" 
                    id="username" 
                    required
                    class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                    placeholder="Enter username"
                />
            </div>

            <div>
                <label class="text-sm font-bold text-slate-600 block mb-1">Password (கடவுச்சொல்)</label>
                <input 
                    type="password" 
                    id="password" 
                    required
                    class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                    placeholder="Enter password"
                />
            </div>

            <button 
                type="submit" 
                id="login-btn"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-md active:scale-95 mt-2"
            >
                Login / உள்நுழைக
            </button>

        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-box');

            // Disable button while waiting
            btn.textContent = 'Authenticating...';
            btn.disabled = true;
            errorBox.classList.add('hidden');

            try {
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // ✅ Save token to browser safe
                    localStorage.setItem('coopOS_token', data.token);
                    // ✅ Redirect to dashboard
                    window.location.href = '/';
                } else {
                    // ❌ Wrong credentials
                    errorBox.classList.remove('hidden');
                    btn.textContent = 'Login / உள்நுழைக';
                    btn.disabled = false;
                }

            } catch (err) {
                errorBox.classList.remove('hidden');
                btn.textContent = 'Login / உள்நுழைக';
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
